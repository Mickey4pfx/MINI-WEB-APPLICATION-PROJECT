

{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body">
        <h4 class="mb-3">{{ title }}</h4>
        <form method="post">
            <div class="mb-3"><label class="form-label">Roll No</label>
                <input class="form-control" name="roll_no" value="{{ s.roll_no if s else '' }}" required></div>
            <div class="mb-3"><label class="form-label">Full name</label>
                <input class="form-control" name="name" value="{{ s.name if s else '' }}" required></div>
            <div class="mb-3"><label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" value="{{ s.email if s else '' }}"></div>
            <div class="mb-3"><label class="form-label">Phone</label>
                <input class="form-control" name="phone" value="{{ s.phone if s else '' }}"></div>
            <div class="row">
                <div class="col-8 mb-3"><label class="form-label">Course</label>
                    <input class="form-control" name="course" value="{{ s.course if s else '' }}" required></div>
                <div class="col-4 mb-3"><label class="form-label">Year</label>
                    <input class="form-control" type="number" min="1" max="6" name="year" value="{{ s.year if s and s.year else '' }}"></div>
            </div>
            <button class="btn btn-primary">Save</button>
            <a class="btn btn-link" href="{{ url_for('students') }}">Cancel</a>
        </form>
    </div></div></div></div>
{% endblock %}
